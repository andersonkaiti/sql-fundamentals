version: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: sql_fundamentals
    volumes:
      # both are synchronized
      - ./scripts:/scripts
      # docker-entrypoint-initdb.d is a directory to automatically run setup
      # scripts when a container is started
      - ./scripts/0-create-database.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
